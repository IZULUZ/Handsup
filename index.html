<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표할래요</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="homeScreen" class="center-screen">
  <h1 class="title">🎤 발표할래요</h1>
  <button class="big-btn teacher-btn" onclick="showTeacher()">교사 모드</button>
  <button class="big-btn student-btn" onclick="showStudent()">학생 모드</button>
</div>

<div id="studentScreen" class="hidden center-screen">
  <h2 class="big-text">번호를 선택하세요</h2>
  <select id="studentNumber" class="big-select"></select>
  <button class="big-btn" onclick="enterStudent()">입장</button>
  <div id="studentStatus" class="status-text"></div>
  <div id="gameArea"></div>
</div>

<div id="teacherScreen" class="hidden center-screen">
  <h2 class="big-text">입장 현황</h2>
  <div id="liveList" class="live-box"></div>
  <button class="big-btn start-btn" onclick="startGame()">게임 시작</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
