<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 부저 v3 - 학생용</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#0f0f1a;color:white;font-family:sans-serif;text-align:center;}
button{padding:18px;font-size:22px;margin:8px;border:none;border-radius:12px;background:#1e90ff;color:white;}
.big{font-size:28px;padding:25px;}
#timerBar{height:6px;background:red;width:100%;transition:width 5s linear;}
</style>
</head>
<body>

<div id="login">
<h2>번호 입력</h2>
<input type="number" id="studentId">
<button onclick="enter()">입장</button>
</div>

<div id="game" style="display:none;">
<div id="timerBar"></div>
<div id="gameArea"></div>
</div>

<script>
const config={ apiKey:"AIzaSyDHG3uB-tqoE-4YLBHHvBRM4YhPh9qa-mI",
authDomain:"handsup-262b8.firebaseapp.com",
databaseURL:"https://handsup-262b8-default-rtdb.firebaseio.com",
projectId:"handsup-262b8",
storageBucket:"handsup-262b8.firebasestorage.app",
messagingSenderId:"494093439378",
appId:"1:494093439378:web:af0a9081d72f021031f14b"};

firebase.initializeApp(config);
const db=firebase.database();

let myId,locked=true;

function enter(){
myId=document.getElementById("studentId").value;
db.ref("students/"+myId).set(true);
db.ref("students/"+myId).onDisconnect().remove();
document.getElementById("login").style.display="none";
}

db.ref("mission").on("value",snap=>{
let m=snap.val();
if(!m)return;
locked=m.locked;
if(!locked)startGame(m.type);
});

function startGame(type){
locked=false;
document.getElementById("game").style.display="block";
let bar=document.getElementById("timerBar");
bar.style.width="100%";
void bar.offsetWidth;
bar.style.width="0%";
setTimeout(()=>locked=true,5000);

if(type==4)agreeGame();
if(type==5)colorGame();
}

function submit(){
if(locked)return;
db.ref("results").push({
student:myId,
serverTime:firebase.database.ServerValue.TIMESTAMP
});
locked=true;
}

function agreeGame(){
let area=document.getElementById("gameArea");
area.innerHTML="";
let correct=Math.floor(Math.random()*8);
for(let i=0;i<8;i++){
let btn=document.createElement("button");
btn.className="big";
btn.innerText= i==correct?"동의하시겠습니까?":"동의하시겠습니가?";
btn.onclick=()=>{
if(i==correct)submit();
};
area.appendChild(btn);
}
}

function colorGame(){
let area=document.getElementById("gameArea");
area.innerHTML="";
let words=["빨강","파랑","초록","노랑"];
let word=words[Math.floor(Math.random()*4)];
let div=document.createElement("div");
div.innerText=word;
div.style.fontSize="40px";
div.style.color=words[Math.floor(Math.random()*4)];
area.appendChild(div);

words.forEach(w=>{
let btn=document.createElement("button");
btn.innerText=w;
btn.onclick=()=>{
if(w===word)submit();
};
area.appendChild(btn);
});
}
</script>
</body>
</html>
