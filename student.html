<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 부저 v4 - 학생용</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
margin:0;
background:#0f0f1a;
color:white;
font-family:sans-serif;
text-align:center;
}
button{
padding:20px;
font-size:22px;
margin:8px;
border:none;
border-radius:10px;
background:#1e90ff;
color:white;
}
</style>
</head>
<body>

<div id="login">
<h2>번호 입력</h2>
<input type="number" id="id">
<button onclick="enter()">입장</button>
</div>

<div id="game" style="display:none;"></div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const config={
apiKey:"AIzaSyDHG3uB-tqoE-4YLBHHvBRM4YhPh9qa-mI",
authDomain:"handsup-262b8.firebaseapp.com",
databaseURL:"https://handsup-262b8-default-rtdb.firebaseio.com",
projectId:"handsup-262b8",
storageBucket:"handsup-262b8.firebasestorage.app",
messagingSenderId:"494093439378",
appId:"1:494093439378:web:af0a9081d72f021031f14b"
};

firebase.initializeApp(config);
const db=firebase.database();

let myId=null;
let locked=true;

window.enter=function(){
myId=document.getElementById("id").value;
if(!myId)return;
db.ref("students/"+myId).set(true);
db.ref("students/"+myId).onDisconnect().remove();
document.getElementById("login").style.display="none";
};

db.ref("mission").on("value",snap=>{
let m=snap.val();
if(!m)return;
locked=m.locked;
if(!locked)startGame(m.type);
});

function startGame(type){
locked=false;
const area=document.getElementById("game");
area.style.display="block";
area.innerHTML="";

if(type==1)agreeGame();
if(type==2)colorGame();
}

function submit(){
if(locked)return;
db.ref("results").push({
student:myId,
time:Date.now()
});
locked=true;
}

function agreeGame(){
let area=document.getElementById("game");
for(let i=0;i<6;i++){
let btn=document.createElement("button");
btn.innerText=i==0?"동의하시겠습니까?":"동의하시겠습니가?";
btn.onclick=()=>{ if(i==0)submit(); };
area.appendChild(btn);
}
db.ref("progress/"+myId).set("약관 확인중");
}

function colorGame(){
let area=document.getElementById("game");
let words=["빨강","파랑","초록","노랑"];
let word=words[Math.floor(Math.random()*4)];
let title=document.createElement("h2");
title.innerText=word;
title.style.color=words[Math.floor(Math.random()*4)];
area.appendChild(title);

words.forEach(w=>{
let btn=document.createElement("button");
btn.innerText=w;
btn.onclick=()=>{ if(w===word)submit(); };
area.appendChild(btn);
});
db.ref("progress/"+myId).set("색깔 판단중");
}

});
</script>
</body>
</html>
