<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Student Panel</title>
<link rel="stylesheet" href="css/style.css">

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script defer src="js/student.js"></script>
</head>
<body class="dark">

<div id="login" class="center-panel">
  <h2>번호 입력</h2>
  <input type="text" id="numberInput" placeholder="번호 입력">
  <button onclick="enterGame()">입장</button>
</div>

<div id="waiting" class="center-panel hidden">
  <h2 class="neon">게임 대기 중...</h2>
</div>

<div id="game" class="center-panel hidden">
  <div id="gameArea"></div>
</div>

</body>
</html>
