<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 부저 - 학생용</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;}
button{padding:18px;font-size:20px;margin:6px;border:none;border-radius:8px;background:#2979ff;color:#fff;}
</style>
</head>
<body>

<div id="login">
<h2>번호 입력</h2>
<input type="number" id="id">
<button onclick="enter()">입장</button>
</div>

<div id="game" style="display:none;"></div>

<script>
const config={
apiKey:"AIzaSyDHG3uB-tqoE-4YLBHHvBRM4YhPh9qa-mI",
authDomain:"handsup-262b8.firebaseapp.com",
databaseURL:"https://handsup-262b8-default-rtdb.firebaseio.com",
projectId:"handsup-262b8",
storageBucket:"handsup-262b8.firebasestorage.app",
messagingSenderId:"494093439378",
appId:"1:494093439378:web:af0a9081d72f021031f14b"
};

firebase.initializeApp(config);
const db=firebase.database();

let myId=null;
let locked=true;

function enter(){
myId=document.getElementById("id").value;
if(!myId)return;

db.ref("students/"+myId).set(true);
db.ref("students/"+myId).onDisconnect().remove();
document.getElementById("login").style.display="none";
}

db.ref("mission").on("value",snap=>{
let m=snap.val();
if(!m)return;
locked=m.locked;
if(!locked)startGame();
});

function startGame(){
locked=false;
const area=document.getElementById("game");
area.style.display="block";
area.innerHTML="";

let correct=Math.floor(Math.random()*8);

for(let i=0;i<8;i++){
let btn=document.createElement("button");
btn.innerText=i==correct?"발표하시겠습니까?":"발표하시겠습니가?";
btn.onclick=()=>{
if(i==correct)submit();
};
area.appendChild(btn);
}

db.ref("progress/"+myId).set("판단 중");
}

function submit(){
if(locked)return;
db.ref("results").push({
student:myId,
time:Date.now()
});
locked=true;
}
</script>
</body>
</html>
