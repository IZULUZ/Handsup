<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 부저 v3 - 교사용</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#0f0f1a;color:white;font-family:sans-serif;text-align:center;}
button{padding:12px 20px;margin:6px;border:none;border-radius:10px;font-size:16px;cursor:pointer;background:#1e90ff;color:white;}
.card{background:#1c1c2e;margin:8px auto;padding:12px;border-radius:12px;width:85%;}
.rank1{border:2px solid gold;}
.seasonBox{background:#111;margin-top:20px;padding:15px;border-radius:15px;}
</style>
</head>
<body>

<h1>🎮 발표 부저 v3 PRO</h1>

<h2>📡 접속 학생</h2>
<div id="studentsList"></div>

<h2>🎯 미션</h2>
<button onclick="startMission(1)">단어</button>
<button onclick="startMission(2)">게이지</button>
<button onclick="startMission(3)">도망</button>
<button onclick="startMission(4)">동의하시겠습니가?</button>
<button onclick="startMission(5)">색깔일치</button>
<button onclick="resetGame()">초기화</button>

<h2>🏆 이번 판 순위</h2>
<div id="ranking"></div>

<div class="seasonBox">
<h2>🏅 시즌 랭킹</h2>
<div id="seasonRanking"></div>
<button onclick="resetSeason()">시즌 초기화</button>
</div>

<script>
const config={
apiKey:"AIzaSyDHG3uB-tqoE-4YLBHHvBRM4YhPh9qa-mI",
authDomain:"handsup-262b8.firebaseapp.com",
databaseURL:"https://handsup-262b8-default-rtdb.firebaseio.com",
projectId:"handsup-262b8",
storageBucket:"handsup-262b8.firebasestorage.app",
messagingSenderId:"494093439378",
appId:"1:494093439378:web:af0a9081d72f021031f14b"
};

firebase.initializeApp(config);
const db=firebase.database();

const studentsRef=db.ref("students");
const resultsRef=db.ref("results");
const missionRef=db.ref("mission");
const seasonRef=db.ref("season/current");

let currentSeason="season1";
seasonRef.on("value",snap=>{
if(snap.val())currentSeason=snap.val();
});

studentsRef.limitToFirst(50).on("value",snap=>{
let html="";
snap.forEach(s=>{
html+=`<div class="card">학생 ${s.key}</div>`;
});
document.getElementById("studentsList").innerHTML=html;
});

resultsRef.on("value",snap=>{
let arr=[];
snap.forEach(s=>arr.push(s.val()));
arr.sort((a,b)=>a.serverTime-b.serverTime);

let html="";
arr.forEach((r,i)=>{
if(i<3){
updateSeasonScore(r.student,i);
}
html+=`<div class="card ${i==0?"rank1":""}">
${i+1}등 - 학생 ${r.student}
</div>`;
});
document.getElementById("ranking").innerHTML=html;
});

function updateSeasonScore(student,rank){
let point= rank==0?3:rank==1?2:rank==2?1:0;
if(point===0)return;
db.ref(`season/${currentSeason}/scores/${student}`).transaction(v=>{
return (v||0)+point;
});
loadSeasonRanking();
}

function loadSeasonRanking(){
db.ref(`season/${currentSeason}/scores`).once("value",snap=>{
let arr=[];
snap.forEach(s=>arr.push({id:s.key,score:s.val()}));
arr.sort((a,b)=>b.score-a.score);
let html="";
arr.forEach((r,i)=>{
html+=`<div class="card">${i+1}위 - 학생 ${r.id} (${r.score}점)</div>`;
});
document.getElementById("seasonRanking").innerHTML=html;
});
}

function startMission(type){
resultsRef.remove();
missionRef.set({
type:type,
startTime:firebase.database.ServerValue.TIMESTAMP,
locked:false
});
setTimeout(()=>missionRef.update({locked:true}),5000);
}

function resetGame(){
missionRef.set(null);
resultsRef.remove();
}

function resetSeason(){
db.ref(`season/${currentSeason}`).remove();
}
</script>
</body>
</html>
