<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 부저 - 교사용</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;}
button{padding:10px 18px;margin:6px;border:none;border-radius:8px;background:#2979ff;color:#fff;font-size:15px;}
.card{background:#1e1e2f;margin:6px auto;padding:8px;border-radius:8px;width:90%;}
.rank1{border:2px solid gold;}
canvas{position:fixed;top:0;left:0;pointer-events:none;}
</style>
</head>
<body>

<h1>🎮 발표 부저 (교사용)</h1>

<h2>접속 학생</h2>
<div id="students"></div>

<h2>진행 상황</h2>
<div id="progress"></div>

<h2>미션</h2>
<button onclick="startMission()">발표하시겠습니까?</button>
<button onclick="resetAll()">초기화</button>

<h2>순위</h2>
<div id="ranking"></div>

<canvas id="fire"></canvas>

<script>
const config={
apiKey:"AIzaSyDHG3uB-tqoE-4YLBHHvBRM4YhPh9qa-mI",
authDomain:"handsup-262b8.firebaseapp.com",
databaseURL:"https://handsup-262b8-default-rtdb.firebaseio.com",
projectId:"handsup-262b8",
storageBucket:"handsup-262b8.firebasestorage.app",
messagingSenderId:"494093439378",
appId:"1:494093439378:web:af0a9081d72f021031f14b"
};

firebase.initializeApp(config);
const db=firebase.database();

const studentsRef=db.ref("students");
const progressRef=db.ref("progress");
const resultsRef=db.ref("results");
const missionRef=db.ref("mission");

let winnerShown=false;

/* 학생 접속 */
studentsRef.on("value",snap=>{
let html="";
snap.forEach(s=>{
html+=`<div class="card">학생 ${s.key} 접속</div>`;
});
document.getElementById("students").innerHTML=html;
});

/* 진행 상황 */
progressRef.on("value",snap=>{
let html="";
snap.forEach(s=>{
html+=`<div class="card">학생 ${s.key} → ${s.val()}</div>`;
});
document.getElementById("progress").innerHTML=html;
});

/* 결과 */
resultsRef.on("value",snap=>{
let arr=[];
snap.forEach(s=>arr.push(s.val()));
arr.sort((a,b)=>a.time-b.time);

let html="";
arr.forEach((r,i)=>{
html+=`<div class="card ${i==0?"rank1":""}">
${i+1}등 - 학생 ${r.student}
</div>`;
});
document.getElementById("ranking").innerHTML=html;

if(arr.length>0 && !winnerShown){
winnerShown=true;
fireworks();
}
});

function startMission(){
winnerShown=false;
resultsRef.remove();
progressRef.remove();
missionRef.set({
startTime:Date.now(),
locked:false
});
setTimeout(()=>missionRef.update({locked:true}),5000);
}

function resetAll(){
missionRef.set(null);
resultsRef.remove();
progressRef.remove();
}

/* 폭죽 */
function fireworks(){
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<120;i++){
particles.push({
x:canvas.width/2,
y:canvas.height/2,
vx:(Math.random()-0.5)*8,
vy:(Math.random()-0.5)*8,
life:100
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;
ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
ctx.fillRect(p.x,p.y,4,4);
});
particles=particles.filter(p=>p.life>0);
if(particles.length>0)requestAnimationFrame(animate);
}
animate();
}
</script>
</body>
</html>
