<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 부저 - 교사용</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<style>
body {
  margin:0;
  background:#0f0f1a;
  color:white;
  font-family: 'Segoe UI', sans-serif;
  text-align:center;
}

h1 { color:#ff3c3c; }

.container { padding:20px; }

button {
  padding:15px 25px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#1e90ff;
  color:white;
  transition:0.2s;
}

button:hover {
  transform:scale(1.05);
  background:#ff3c3c;
}

.card {
  background:#1c1c2e;
  margin:10px auto;
  padding:15px;
  border-radius:15px;
  width:80%;
  box-shadow:0 0 15px #1e90ff55;
}

.rank1 { border:3px solid gold; }
.rank2 { border:3px solid silver; }

#studentsList {
  margin-top:20px;
}
</style>
</head>

<body>
<div class="container">
<h1>🎮 발표 부저 시스템 (교사용)</h1>

<h2>📡 학생 접속 현황</h2>
<div id="studentsList"></div>

<h2>🎯 미션 선택</h2>
<button onclick="startMission(1)">정확한 단어 찾기</button>
<button onclick="startMission(2)">게이지 채우기</button>
<button onclick="startMission(3)">도망가는 버튼 잡기</button>
<button onclick="resetGame()" style="background:#555;">초기화</button>

<h2>🏆 발표 순위</h2>
<div id="ranking"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHG3uB-tqoE-4YLBHHvBRM4YhPh9qa-mI",
  authDomain: "handsup-262b8.firebaseapp.com",
  databaseURL: "https://handsup-262b8-default-rtdb.firebaseio.com",
  projectId: "handsup-262b8",
  storageBucket: "handsup-262b8.firebasestorage.app",
  messagingSenderId: "494093439378",
  appId: "1:494093439378:web:af0a9081d72f021031f14b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const studentsRef = db.ref("students");
const resultsRef = db.ref("results");
const missionRef = db.ref("mission");

studentsRef.on("value", snap=>{
  const data = snap.val() || {};
  const container = document.getElementById("studentsList");
  container.innerHTML="";
  Object.keys(data).forEach(id=>{
    container.innerHTML += `<div class="card">학생 ${id} 접속중</div>`;
  });
});

resultsRef.on("value", snap=>{
  const data = snap.val() || {};
  const arr = Object.values(data).sort((a,b)=>a.time-b.time);
  const ranking = document.getElementById("ranking");
  ranking.innerHTML="";
  arr.forEach((r,i)=>{
    let cls="";
    if(i===0) cls="rank1";
    if(i===1) cls="rank2";
    ranking.innerHTML += `
      <div class="card ${cls}">
        ${i+1}등 - 학생 ${r.student} (${r.time}ms)
      </div>`;
  });
});

function startMission(type){
  missionRef.set({
    type:type,
    startTime:Date.now()
  });
  resultsRef.remove();
}

function resetGame(){
  missionRef.set(null);
  resultsRef.remove();
}
</script>

</body>
</html>
